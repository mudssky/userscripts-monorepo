name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: install deps
        run: pnpm install --frozen-lockfile

      # changesets 只负责版本管理（创建 Version PR），不执行 publish
      - name: create version pull request
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Version PR 合并后：构建 + 创建 GitHub Release
      - name: build and create github releases
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm run build
          for pkg_dir in userscripts/*/; do
            pkg_name=$(node -p "require('./${pkg_dir}package.json').name")
            pkg_version=$(node -p "require('./${pkg_dir}package.json').version")
            # vite 输出文件名不含 scope，取最后一个 / 后的部分
            pkg_basename="${pkg_name##*/}"
            tag="${pkg_name}@${pkg_version}"
            file="${pkg_dir}dist/${pkg_basename}.user.js"

            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release ${tag} already exists, skipping"
              continue
            fi

            if [ -f "$file" ]; then
              echo "Creating release ${tag}"
              gh release create "$tag" "$file" \
                --title "${tag}" \
                --notes "See CHANGELOG.md for details."
            fi
          done
